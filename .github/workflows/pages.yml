name: Build and deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages base URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up pinned Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.170.0"
          extended: false

      - name: Verify Hugo version pin
        run: ./scripts/check_hugo_version.sh hugo

      - name: Install pinned CleanWhite theme
        run: ./scripts/install_theme.sh

      - name: Build noindex staging site
        env:
          HUGO_ENVIRONMENT: staging
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base_url="${PAGES_BASE_URL%/}/"
          hugo --environment staging --baseURL "$base_url" --destination public --gc --minify

      - name: Audit generated routes and staging metadata
        run: |
          python3 scripts/audit_site.py \
            --site public \
            --mode staging \
            --base-url "${{ steps.pages.outputs.base_url }}/" \
            --require-content

      - name: Audit repository, history, and generated output
        run: python3 scripts/security_audit.py --repo . --site public --include-index --include-history

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy staging artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
