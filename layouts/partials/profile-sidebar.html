<aside class="profile-sidebar" aria-labelledby="profile-sidebar-title">
  <section>
    <h2 id="profile-sidebar-title">About me</h2>
    {{ with .Site.Params.sidebar_avatar }}
      <img class="profile-avatar" src="{{ . | relURL }}" alt="Brent Salisbury" width="220" height="220" loading="lazy">
    {{ end }}
    {{ with .Site.Params.sidebar_about_description }}<p class="profile-bio">{{ . }}</p>{{ end }}
    <nav class="profile-socials" aria-label="Brent Salisbury on social media">
      {{ with .Site.Params.social.linkedin }}
        <a href="{{ . }}" aria-label="LinkedIn" title="LinkedIn" rel="me noopener noreferrer" target="_blank">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14ZM8.34 18.34V9.9H5.53v8.44h2.81ZM6.94 8.75a1.63 1.63 0 1 0 0-3.26 1.63 1.63 0 0 0 0 3.26Zm11.4 9.59v-4.62c0-2.47-1.32-3.62-3.08-3.62-1.42 0-2.06.78-2.41 1.33V9.9h-2.8v8.44h2.8v-4.17c0-1.1.21-2.16 1.57-2.16s1.38 1.26 1.38 2.23v4.1h2.54Z"/></svg>
        </a>
      {{ end }}
      {{ with .Site.Params.social.twitter }}
        <a href="{{ . }}" aria-label="X" title="X" rel="me noopener noreferrer" target="_blank">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.78 7.75L23.2 22h-6.25l-4.9-6.4L6.46 22H3.3l7.25-8.29L2.8 2h6.4l4.42 5.84L18.9 2Zm-1.1 18h1.73L8.27 3.9H6.4L17.8 20Z"/></svg>
        </a>
      {{ end }}
      {{ with .Site.Params.social.github }}
        <a href="{{ . }}" aria-label="GitHub" title="GitHub" rel="me noopener noreferrer" target="_blank">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.51-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.75 10.75 0 0 1 5.64 0c2.15-1.45 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.64 5.28-5.15 5.56.41.36.77 1.04.77 2.1v3.13c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg>
        </a>
      {{ end }}
    </nav>
  </section>
</aside>
