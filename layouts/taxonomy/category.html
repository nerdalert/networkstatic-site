{{ define "main" }}
<div class="sidebar-layout archive-layout">
  <section class="main-column archive-page">
    <header class="page-heading"><p class="eyebrow">{{ .Data.Singular | humanize }}</p><h1>{{ .Title }}</h1></header>
    <div class="article-list">{{ range .Paginator.Pages }}{{ partial "article-card.html" . }}{{ end }}</div>
    {{ partial "pagination.html" . }}
  </section>
  {{ partial "profile-sidebar.html" . }}
</div>
{{ end }}
